<!DOCTYPE html>
<html>
<head>
    <title>Login - Teacher Substitution System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">

<div class="auth-container">
    <div class="auth-side">
        <div class="icon">🔒</div>
        <h2>Welcome Back!</h2>
        <p>Login to access your school's Teacher Substitution System and manage absences efficiently.</p>
    </div>
    
    <div class="auth-form">
        <h1>Login</h1>
        
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
        
        <form method="POST">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="school@example.com">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            
            <button type="submit">🔓 Login to Dashboard</button>
        </form>
        
        <div class="auth-link">
            Don't have an account? <a href="/register">Create one here</a>
        </div>
    </div>
</div>

</body>
</html>
